ekf_filter_node:
  ros__parameters:

    # Simulation time
    use_sim_time: true

    # EKF settings
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    # Coordinate frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link 
    world_frame: odom 

    # Wheel odometry
    odom0: /odom

    odom0_config: [
      false, false, false,
      false, false, false,
      true, false, false,
      false, false, false,
      false, false, false
    ]

    odom0_queue_size: 10

    # IMU
    imu0: /imu/data

    imu0_config: [
      false, false, false, 
      false, false, false, 
      false, false, false, 
      false, false, true, 
      false, false, false
    ]

    imu0_queue_size: 10

    # Diagnostics
    print_diagnostics: true